<!DOCTYPE html>
<html>
<head>
    <title>Test Accessibility Cloud Widget</title>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        #map { height: 400px; width: 100%; margin: 20px 0; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Accessibility Cloud Widget Test</h1>
    <div id="status" class="status info">Initializing widget...</div>

    <div id="map"></div>

    <div id="accessibility-cloud-results"></div>

    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiYXZlcnljb3RlIiwiYSI6ImNtZWxpdmpxMzBpOWQyanE0Z2p2YWRicjIifQ.fQzZ_KDIxILvcV471Z3EjQ';
        let map;
        let markers = [];

        // Initialize Mapbox
        function initMap() {
            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/streets-v12',
                center: [-63.5752, 44.6488], // Halifax [lng, lat]
                zoom: 12
            });

            document.getElementById('status').innerHTML = 'Mapbox loaded. Loading Accessibility Cloud widget...';
            loadAccessibilityWidget();
        }

        // Load Accessibility Cloud widget
        function loadAccessibilityWidget() {
            window.onAccessibilityCloudLoaded = function (AccessibilityCloud) {
                document.getElementById('status').innerHTML = 'Accessibility Cloud widget loaded successfully!';
                document.getElementById('status').className = 'status success';

                // Initialize widget
                const element = document.querySelector('#accessibility-cloud-results');
                AccessibilityCloud.render(element, {
                    token: 'eb848ae2fbaff7680ff34a9f31eabf06',
                    locale: 'en_US',
                    requestParameters: {
                        latitude: 44.6488, // Halifax center
                        longitude: -63.5752,
                        accuracy: 10000, // 10km radius
                        limit: 50, // Get more results
                        filter: 'at-least-partially-accessible-by-wheelchair',
                    },
                    onDataLoaded: function(data) {
                        document.getElementById('status').innerHTML = `Data loaded! Found ${data.length} places. Creating markers...`;
                        console.log('Data loaded:', data);
                        createMarkers(data);
                    },
                    onPlaceClick: function(place) {
                        console.log('Place clicked:', place);
                    },
                    onError: function(error) {
                        document.getElementById('status').innerHTML = 'Error: ' + error.message;
                        document.getElementById('status').className = 'status error';
                        console.error('Widget error:', error);
                    }
                });
            };

            // Load CSS
            const cssLink = document.createElement('link');
            cssLink.rel = 'stylesheet';
            cssLink.href = 'https://cdn.jsdelivr.net/gh/sozialhelden/accessibility-cloud-js@3.2.1/build/example/accessibility.cloud-3.2.1-2350f78a.css';
            document.head.appendChild(cssLink);

            // Load JavaScript
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/gh/sozialhelden/accessibility-cloud-js@3.2.1/build/example/accessibility.cloud-3.2.1-21a6710d.min.js';
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        }

        // Create markers on map
        function createMarkers(places) {
            // Clear existing markers
            markers.forEach(marker => marker.remove());
            markers = [];

            console.log('Creating markers for', places.length, 'places');

            places.forEach((place, index) => {
                const coords = place.geometry?.coordinates || place.coordinates;
                if (!coords) {
                    console.log('No coordinates for place', index);
                    return;
                }

                // Create custom marker element
                const markerElement = document.createElement('div');
                markerElement.style.backgroundImage = `url(${getAccessibilityIcon(place.properties?.wheelchair || place.wheelchair)})`;
                markerElement.style.width = '24px';
                markerElement.style.height = '24px';
                markerElement.style.backgroundSize = 'contain';
                markerElement.style.backgroundRepeat = 'no-repeat';
                markerElement.style.cursor = 'pointer';

                const marker = new mapboxgl.Marker(markerElement)
                    .setLngLat([coords[0], coords[1]])
                    .addTo(map);

                // Add click listener
                marker.getElement().addEventListener('click', () => {
                    const popup = new mapboxgl.Popup({ closeButton: true, closeOnClick: true })
                        .setLngLat([coords[0], coords[1]])
                        .setHTML(`
                            <div style="max-width: 300px; font-family: Arial, sans-serif; padding: 8px;">
                                <h3 style="margin: 0 0 8px 0; color: #333; font-size: 16px; font-weight: bold;">${place.properties?.name || place.name?.en || 'Accessible Place'}</h3>
                                <div style="margin-bottom: 8px;">
                                    <span style="background: ${getWheelchairColor(place.properties?.wheelchair || place.wheelchair)}; color: white; padding: 2px 6px; border-radius: 3px; font-size: 12px;">
                                        ${getWheelchairText(place.properties?.wheelchair || place.wheelchair)}
                                    </span>
                                </div>
                                <p style="margin: 4px 0;"><strong>Category:</strong> ${place.properties?.category || place.category || 'Unknown'}</p>
                            </div>
                        `)
                        .addTo(map);
                });

                markers.push(marker);
                console.log('Created marker', index + 1, 'at', coords[0], coords[1]);
            });

            document.getElementById('status').innerHTML = `Created ${markers.length} markers on the map!`;
            console.log('Total markers created:', markers.length);
        }

        // Get accessibility icon
        function getAccessibilityIcon(wheelchairStatus) {
            switch (wheelchairStatus) {
                case 'yes':
                    return 'data:image/svg+xml;charset=UTF-8,%3csvg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"%3e%3ccircle cx="12" cy="12" r="10" fill="%2300AA00" opacity="0.8"/%3e%3cpath d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="white"/%3e%3c/svg%3e';
                case 'limited':
                    return 'data:image/svg+xml;charset=UTF-8,%3csvg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"%3e%3ccircle cx="12" cy="12" r="10" fill="%23FFAA00" opacity="0.8"/%3e%3ctext x="12" y="16" text-anchor="middle" fill="white" font-size="14" font-weight="bold"%3e!%3c/text%3e%3c/svg%3e';
                case 'no':
                    return 'data:image/svg+xml;charset=UTF-8,%3csvg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"%3e%3ccircle cx="12" cy="12" r="10" fill="%23CC0000" opacity="0.8"/%3e%3cpath d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="white"/%3e%3c/svg%3e';
                default:
                    return 'data:image/svg+xml;charset=UTF-8,%3csvg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"%3e%3ccircle cx="12" cy="12" r="10" fill="%23888888" opacity="0.8"/%3e%3ctext x="12" y="16" text-anchor="middle" fill="white" font-size="12"%3e?%3c/text%3e%3c/svg%3e';
            }
        }

        function getWheelchairColor(wheelchairStatus) {
            switch (wheelchairStatus) {
                case 'yes': return '#00AA00';
                case 'limited': return '#FFAA00';
                case 'no': return '#CC0000';
                default: return '#888888';
            }
        }

        function getWheelchairText(wheelchairStatus) {
            switch (wheelchairStatus) {
                case 'yes': return '♿ Accessible';
                case 'limited': return '♿ Limited';
                case 'no': return '❌ Not Accessible';
                default: return '❓ Unknown';
            }
        }

        // Initialize when page loads
        window.onload = initMap;
    </script>
</body>
</html>
