[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node --max-old-space-size=1024 --optimize-for-size server/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.environmentVariables]]
name = "NODE_ENV"
value = "production"

[[deploy.environmentVariables]]
name = "NODE_OPTIONS"  
value = "--max-old-space-size=1024 --optimize-for-size"

[[deploy.environmentVariables]]
name = "CI"
value = "false"
