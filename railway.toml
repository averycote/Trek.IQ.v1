[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production]
variables = { NODE_ENV = "production", PORT = "3000" }

# Build configuration for Railway - using pre-built client files
[build.env]
NODE_ENV = "production"
NIXPACKS_BUILD_CMD = "npm run build"
