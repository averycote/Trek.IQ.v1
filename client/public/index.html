<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/trek-iq-logo.png" />

    <!-- Mobile Viewport Settings -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- CSP temporarily disabled to fix Mapbox loading issues -->
    <meta name="theme-color" content="#14b8a6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trek.IQ" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <meta
      name="description"
      content="Trek.IQ - Accessibility-focused routing and data visualization for Halifax. Plan accessible routes with real-time barrier detection and navigation assistance."
    />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/trek-iq-logo.png" />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="%PUBLIC_URL%/trek-iq-logo.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/trek-iq-logo.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="%PUBLIC_URL%/trek-iq-logo.png"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.mapbox.com" />
    
    <!-- DNS prefetch for performance -->
    <link rel="dns-prefetch" href="//nominatim.openstreetmap.org" />
    <link rel="dns-prefetch" href="//external.transitapp.com" />

    <title>Trek.IQ - Accessible Routing for Halifax</title>

    <!-- Mapbox GL CSS with performance optimizations -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
        rel="stylesheet"
      />
    </noscript>

    <!-- Prevent zoom on input focus for iOS -->
    <style>
      input[type="text"],
      input[type="search"],
      input[type="email"],
      input[type="tel"],
      textarea,
      select {
        font-size: 16px !important;
      }

      /* Prevent horizontal scrolling */
      html,
      body {
        overflow-x: hidden;
        position: relative;
        width: 100%;
      }

      /* Ensure proper touch targets */
      button,
      [role="button"],
      input[type="button"],
      input[type="submit"],
      input[type="reset"] {
        min-height: 44px;
        min-width: 44px;
      }

      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Prevent text selection on interactive elements */
      button,
      [role="button"],
      .fab-button,
      .action-button {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
